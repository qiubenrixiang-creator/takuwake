<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E24">
  <meta name="description" content="ボードゲーム会の 席きめ。質問に こたえると、にた者どうしが 同じ卓に あつまります。">
  <title>たくわけの やかた</title>
  <!-- よる／ひるを 最初の 描画の 前に 当てる（ちらつき防止）。BGL と 同じ 保存場所 -->
  <script>try{if(JSON.parse(localStorage.getItem('bgl.theme2'))==='day')document.documentElement.setAttribute('data-theme','day')}catch(e){}</script>
  <!-- ドット文字。画面の 表示を 待たせないよう、あとから 当てる -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="./"><span class="ico" data-icon="yakata"></span><span>たくわけの やかた</span></a>
      <button class="icon-btn snd" id="btn-bgm" type="button" aria-label="BGM">♪</button>
      <button class="icon-btn snd" id="btn-se" type="button" aria-label="こうかおん">SE</button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="よる／ひる">よる</button>
    </div>
  </header>

  <main class="wrap" id="screen"></main>

  <nav class="tabbar" aria-label="メニュー">
    <div class="tabbar-in">
      <button class="tab" type="button" data-tab="ask"><span class="i" data-icon="ask"></span>しんだん</button>
      <button class="tab" type="button" data-tab="zukan"><span class="i" data-icon="book"></span>ずかん<span class="dot" id="zukan-dot" hidden></span></button>
      <button class="tab" type="button" data-tab="seat"><span class="i" data-icon="seat"></span>せき<span class="dot" id="seat-dot" hidden></span></button>
      <a class="tab" id="tab-library" href="../board-game-library/"><span class="i" data-icon="chest"></span>ライブラリー</a>
    </div>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
